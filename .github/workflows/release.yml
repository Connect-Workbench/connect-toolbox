name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Install Webview dependencies
        run: npm ci
        working-directory: webview

      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match package.json version $package_version"
            exit 1
          fi

      - name: Typecheck Extension Host
        run: npm run typecheck

      - name: Typecheck Webview
        run: npm run typecheck:webview

      - name: Build VSIX
        run: npm run package

      - name: Locate VSIX and generate checksum
        id: vsix
        shell: bash
        run: |
          set -euo pipefail
          vsix_path="$(find . -maxdepth 1 -type f -name '*.vsix' -print -quit)"
          if [[ -z "$vsix_path" ]]; then
            echo 'No VSIX package was generated'
            exit 1
          fi
          sha256sum "$vsix_path" > "$vsix_path.sha256"
          echo "path=$vsix_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$vsix_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VSIX_PATH: ${{ steps.vsix.outputs.path }}
          CHECKSUM_PATH: ${{ steps.vsix.outputs.checksum_path }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$VSIX_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Connect Toolbox $RELEASE_TAG" \
            --generate-notes
